<style>
:root{--ink:#140a08;--ash:#e9d9c0;--ember:#ff7a20;--gold:#ffd45a;--bg:#140a08;--fg:#e9d9c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:var(--fg);background:rgba(20,10,8,.8);border:1px solid #6b3a22;border-radius:10px;padding:10px 14px}
button:focus-visible{outline:2px solid var(--gold)}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
#top *{pointer-events:auto}
#bars{flex:1;font-size:12px;pointer-events:none}
.bar{height:9px;background:#2a1612;border-radius:5px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%}
#tut{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:86%;text-align:center;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
#jz{position:fixed;left:0;bottom:0;width:55%;height:60%}
#jb{position:fixed;width:90px;height:90px;border-radius:50%;border:2px solid rgba(233,217,192,.35);display:none}
#jk{position:absolute;left:30px;top:30px;width:30px;height:30px;border-radius:50%;background:rgba(233,217,192,.5)}

.ov,.ov *{touch-action:manipulation}
.card{max-width:420px;width:100%;max-height:90%;overflow:auto;text-align:center}
.card h2{margin:0 0 8px;font-weight:normal;letter-spacing:1px}
.card p{line-height:1.5;margin:8px 0}
.card button{margin:4px}

#title .card{position:relative}
#title h1{font-size:30px;font-weight:normal;margin:0 0 6px;text-shadow:0 2px 8px #000}
#jz{width:45%}
#act{width:262px;height:262px;right:8px}
#act button{width:56px;height:56px;right:auto;bottom:auto;font-size:11px}

#tut{top:74px}
#mm{position:fixed;right:96px;top:62px;width:100px;height:71px;border:2px solid #6b3a22;border-radius:8px;z-index:3}
#mm.big{width:300px;height:214px;top:50%;left:50%;right:auto;transform:translate(-50%,-50%)}
button{-webkit-touch-callout:none;touch-action:manipulation}
*{-webkit-user-select:none}textarea{-webkit-user-select:text}
button{background:rgba(80,44,30,.92);border-color:#b8743f}
